data:
  url: https://motchallenge.net/data/MOT17.zip
  # MOT17 stores every sequence three times (one copy per public detector: DPM, FRCNN, SDP);
  # frames and ground truth are identical, so one copy is enough
  variant: FRCNN
  sequences: [MOT17-02, MOT17-04, MOT17-05, MOT17-09, MOT17-10, MOT17-11, MOT17-13]
  workers: 16

# split by sequence, never by frame: neighbouring frames are almost identical,
# so a frame-level split would leak the validation scenes into training
split:
  train: [MOT17-04, MOT17-05, MOT17-11, MOT17-13]
  val: [MOT17-02, MOT17-09, MOT17-10]

detect:
  models: [yolo11n.pt, yolo11s.pt]
  imgsz: [640, 1280]
  conf: 0.01        # keep low-score boxes: AP needs the whole precision-recall curve
  max_det: 300

evaluate:
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  visibility_bins: [0.0, 0.3, 0.6, 1.01]
  height_bins: [0, 50, 100, 200, 10000]

track:
  detector: yolo11s-1280      # cached detection run the tracker reads
  interpolate_gap: 20         # fill gaps of up to 20 frames inside a track (offline); 0 = off
  tracker:                    # see src/tracker.py; high_thresh, match_thresh, track_buffer tuned on train
    high_thresh: 0.4
    low_thresh: 0.1
    new_track_thresh: null    # null: high_thresh + 0.1
    match_thresh: 0.9
    low_match_thresh: 0.5
    tentative_match_thresh: 0.7
    track_buffer: 30
    fuse_score: true
    min_box_area: 100
    max_aspect: 1.6
  tune:                       # python -m src.track --tune (training sequences)
    objective: idf1
    grid:
      high_thresh: [0.3, 0.4, 0.5, 0.6]
      match_thresh: [0.7, 0.8, 0.9]
      track_buffer: [30, 60]
  experiments:                # validation sequences; each entry overrides the settings above
    sort-style: {low_thresh: null, track_buffer: 1, interpolate_gap: 0}
    no-low-boxes: {low_thresh: null, interpolate_gap: 0}
    bytetrack: {interpolate_gap: 0}
    bytetrack+interp: {}
    bytetrack+interp-yolo11n: {detector: yolo11n-1280}
    bytetrack+interp-finetuned: {detector: yolo11n-mot17-1280}
    bytetrack+interp-nms07: {detector: yolo11s-onnx-iou07-1280}
  reference:                  # python -m src.reference_track (library ByteTrack, default settings)
    model: yolo11s.pt
    imgsz: 1280
    conf: 0.1

# fine-tuning the detector on the training sequences (python -m src.prepare_yolo, python -m src.train)
train:
  model: yolo11n.pt           # COCO-pretrained start; the class head is replaced by one class, person
  name: yolo11n-mot17         # saved as models/weights/yolo11n-mot17.pt
  imgsz: 800                  # training size; larger sizes run out of memory on an 8 GB M1
  epochs: 10
  batch: 4
  frame_step: 4               # every 4th frame: neighbouring frames are near duplicates
  holdout: 0.2                # last 20% of each training sequence, for model selection during training
  gap: 30                     # frames dropped between the training part and the holdout part
  extra_classes: [2, 7]       # people on vehicles and static people are labelled as persons too
  seed: 0

# people counting, crowd size and heatmaps on the static-camera sequences (python -m src.analytics)
analytics:
  sequences:                  # counting line from point a to point b in pixels; for a line drawn top to bottom,
                              # walking right to left counts as "in"
    MOT17-02: {line: [[960, 450], [960, 1080]]}
    MOT17-09: {line: [[1100, 500], [1100, 1080]]}
    MOT17-04: {line: [[0, 650], [1920, 650]]}
  smooth: 5                   # moving average of the feet position over 5 frames
  min_gap: 15                 # a crossing back within 15 frames cancels both
  match_window: 15            # a counted crossing is correct within +-15 frames of a true one
  render:                     # python -m src.render [--gif]
    sequence: MOT17-09
    fps: 15
    video_width: 960
    trail: 30
    gif_frames: [100, 400]
    gif_step: 3
    gif_width: 480

# deployment: ONNX export, speed, live app (python -m src.deploy export|detect|benchmark, python -m src.app)
deploy:
  models: [yolo11n.pt, yolo11s.pt]
  imgsz: [736, 1280]          # height, width: 16:9 video at 1280 px wide, height padded to a multiple of 32
  conf: 0.01                  # for the AP check of the ONNX models (as in detect)
  nms_iou: [0.5, 0.7]         # 0.5: as the PyTorch runs (export check); 0.7 keeps more overlapping people
  app_conf: 0.1               # live use: the tracker ignores boxes below its low threshold (0.1) anyway
  app_model: models/weights/yolo11n-1280.onnx   # nano: about the accuracy of the small model at 1280 px, twice as fast
  benchmark:
    sequence: MOT17-09
    frames: 100
    warmup: 10
