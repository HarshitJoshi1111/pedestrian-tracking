data:
  url: https://motchallenge.net/data/MOT17.zip
  # MOT17 stores every sequence three times (one copy per public detector: DPM, FRCNN, SDP);
  # frames and ground truth are identical, so one copy is enough
  variant: FRCNN
  sequences: [MOT17-02, MOT17-04, MOT17-05, MOT17-09, MOT17-10, MOT17-11, MOT17-13]
  workers: 16

# split by sequence, never by frame: neighbouring frames are almost identical,
# so a frame-level split would leak the validation scenes into training
split:
  train: [MOT17-04, MOT17-05, MOT17-11, MOT17-13]
  val: [MOT17-02, MOT17-09, MOT17-10]

detect:
  models: [yolo11n.pt, yolo11s.pt]
  imgsz: [640, 1280]
  conf: 0.01        # keep low-score boxes: AP needs the whole precision-recall curve
  max_det: 300

evaluate:
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  visibility_bins: [0.0, 0.3, 0.6, 1.01]
  height_bins: [0, 50, 100, 200, 10000]

track:
  detector: yolo11s-1280      # cached detection run the tracker reads
  interpolate_gap: 20         # fill gaps of up to 20 frames inside a track (offline); 0 = off
  tracker:                    # see src/tracker.py; high_thresh, match_thresh, track_buffer tuned on train
    high_thresh: 0.5
    low_thresh: 0.1
    new_track_thresh: null    # null: high_thresh + 0.1
    match_thresh: 0.8
    low_match_thresh: 0.5
    tentative_match_thresh: 0.7
    track_buffer: 30
    fuse_score: true
    min_box_area: 100
    max_aspect: 1.6
  tune:                       # python -m src.track --tune (training sequences)
    objective: idf1
    grid:
      high_thresh: [0.3, 0.4, 0.5, 0.6]
      match_thresh: [0.7, 0.8, 0.9]
      track_buffer: [30, 60]
  experiments:                # validation sequences; each entry overrides the settings above
    sort-style: {low_thresh: null, track_buffer: 1, interpolate_gap: 0}
    no-low-boxes: {low_thresh: null, interpolate_gap: 0}
    bytetrack: {interpolate_gap: 0}
    bytetrack+interp: {}
    bytetrack+interp-yolo11n: {detector: yolo11n-1280}
  reference:                  # python -m src.reference_track (library ByteTrack, default settings)
    model: yolo11s.pt
    imgsz: 1280
    conf: 0.1
